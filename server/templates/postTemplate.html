<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><%= title %> — fourfivesix.ca</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <a href="/" aria-label="fourfivesix home">fourfivesix</a>
    </header>
    <main>
        <article>
            <h1><%= title %></h1>
            <div class="post-meta">
                <time datetime="<%= publishDate %>"><%= publishDateFormatted %></time>
                <span class="post-author"><%= author %></span>
            </div>
            <div class="post-body">
                <%= markup %>
            </div>
        </article>
    </main>
    <footer>
        <a href="/">fourfivesix.ca</a>
    </footer>
</body>
</html>
